name: Farcaster proof Redis
on:
  pull_request:
    paths:
      - 'apps/backend/src/services/auth/**'
      - 'apps/backend/src/api/routes/auth*'
      - '.github/workflows/farcaster-proof.yml'
      - 'deploy/postdelegate/review/tests/farcaster.proof.rdtest.ts'
  workflow_dispatch:
concurrency:
  group: farcaster-proof-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  redis-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7.2-alpine
        ports:
          - 6391:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Real Redis binding and consumption
        env:
          REDIS_URL: redis://127.0.0.1:6391
          FARCASTER_PROOF_TEST_REDIS: '1'
          FARCASTER_LOGIN_ENABLED: 'true'
          NODE_OPTIONS: --max-old-space-size=2048
        run: pnpm exec jest --runInBand --testMatch '**/farcaster.proof.rdtest.ts'
