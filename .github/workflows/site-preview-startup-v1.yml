name: Corrected raw Pages diagnostic v1

on:
  push:
    branches: [test/site-preview-startup-v1]

permissions:
  contents: read

jobs:
  compile-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WRANGLER_SEND_METRICS: 'false'
      CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /site/functions/
            /site/public/_routes.json
            /site/public/_headers
            /site/public/_redirects
            /site/scripts/pages-worker-build-diagnostic.mjs
            /site/scripts/test-pages-worker-build-diagnostic.mjs
            /site/scripts/stage-pages-worker.mjs
            /site/scripts/pages-startup-probe.mjs
            /site/scripts/test-pages-startup-probe.mjs
            /site/scripts/preview-runtime-diagnostics.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.6.1'
          run_install: false
      - name: Synthetic typed-error/topology checks (fake API only)
        run: |
          node site/scripts/test-pages-worker-build-diagnostic.mjs
          node site/scripts/test-pages-startup-probe.mjs
      - name: Prepare isolated pinned CLI (hosted only)
        run: |
          mkdir -p "$RUNNER_TEMP/startup-cli"
          cd "$RUNNER_TEMP/startup-cli"
          pnpm --ignore-workspace add wrangler@4.162.0 --save-exact
      - name: Compile correct raw Functions and inspect typed boundary
        id: probe
        run: |
          set -euo pipefail
          stage="$(mktemp -d "$RUNNER_TEMP/site-startup.XXXXXX")"
          mkdir "$stage/payload" "$stage/diagnostics"
          echo "path=$stage/diagnostics/*.json" >> "$GITHUB_OUTPUT"
          echo "stage=$stage" >> "$GITHUB_OUTPUT"
          cp site/public/_routes.json site/public/_headers site/public/_redirects "$stage/payload/"
          compiled="$(mktemp -d "$RUNNER_TEMP/site-raw-functions.XXXXXX")"
          "$RUNNER_TEMP/startup-cli/node_modules/.bin/wrangler" pages functions build site/functions --outdir="$compiled"
          node site/scripts/stage-pages-worker.mjs "$compiled" "$stage/payload/_worker.js" "$stage/diagnostics/worker-format.json"
          timeout --signal=TERM --kill-after=2s 25s node site/scripts/pages-worker-build-diagnostic.mjs \
            "$RUNNER_TEMP/startup-cli" "$stage" "$GITHUB_WORKSPACE" "$stage/diagnostics/worker-build.json"
          node --input-type=module - "$stage/diagnostics/worker-build.json" >> "$GITHUB_OUTPUT" <<'JS'
          import { readFileSync } from 'node:fs';
          const r = JSON.parse(readFileSync(process.argv[2]));
          console.log('startup=' + (r.workerUnchanged === true && r.checkRawWorkerEquivalent?.status === 'succeeded' && r.metadataAnalysis?.status === 'succeeded'));
          JS
      - name: One corrected-raw startup only after typed checks pass
        if: ${{ steps.probe.outputs.startup == 'true' }}
        env:
          PROBE_STAGE: ${{ steps.probe.outputs.stage }}
        run: |
          set -euo pipefail
          # Synthetic response only: no full site assets/OG/Astro build or real-site acceptance.
          printf '%s' '<!doctype html><title>Synthetic startup diagnostic</title><p>Not a release payload.</p>' > "$PROBE_STAGE/payload/alternatives.html"
          timeout --signal=TERM --kill-after=2s 45s node site/scripts/pages-startup-probe.mjs \
            "$RUNNER_TEMP/startup-cli" "$PROBE_STAGE" "$GITHUB_WORKSPACE" "$PROBE_STAGE/diagnostics/startup.json"
      - name: Upload synthetic diagnostic only (never a release payload)
        if: ${{ always() && steps.probe.outputs.path != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-worker-build-diagnostic-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.probe.outputs.path }}
          if-no-files-found: error
          retention-days: 3
