---
name: Build

# Check pull requests and the merged main result. Nothing is published: production
# images are built by hand from deploy/postdelegate/Dockerfile.release.
on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      # deploy/** is NOT ignored: the Caddy config that fronts production lives
      # there and nothing else compiles it. It was once committed in a state
      # Caddy refuses to load, and a Caddyfile-only pull request is exactly the
      # shape of change that would have skipped every check.
      - site/**
      - '**/*.md'
      - .github/workflows/uptime.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: pd_security_ledger_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      temporal:
        image: temporalio/auto-setup:1.28.1
        env:
          DB: postgres12
          DB_PORT: '5432'
          POSTGRES_USER: postgres
          POSTGRES_PWD: ci-only
          POSTGRES_SEEDS: postgres
          ENABLE_ES: 'false'
          SKIP_ADD_CUSTOM_SEARCH_ATTRIBUTES: 'true'
          TEMPORAL_NAMESPACE: default
        ports:
          - 7233:7233
        options: >-
          --health-cmd "temporal operator cluster health --address temporal:7233"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 18

    steps:
      - uses: actions/checkout@v4

      - name: Caddy config
        # Caddy itself is the only authority on whether this file loads: a
        # duplicate matcher, an unknown directive or a bad placeholder all
        # fail here instead of on the server. The staging login is supplied
        # from the environment on the server; any bcrypt hash validates.
        run: |
          # generated here, never written down: basic_auth only needs the
          # placeholder to parse as a bcrypt hash
          HASH="$(docker run --rm caddy:2.10-alpine caddy hash-password --plaintext ci)"
          docker run --rm \
            -v "$PWD/deploy/postdelegate/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -e STAGING_BASIC_AUTH_USER=ci \
            -e STAGING_BASIC_AUTH_HASH="$HASH" \
            caddy:2.10-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        id: dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        # the jest suite never ran in CI before; a failing spec now blocks the PR
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm exec jest --ci --forceExit

      - name: Authenticated QA synthetic helpers and filesystem
        # Explicit scope: never bootstraps AppModule or opens HTTP/DB/services.
        run: |
          export PD_QA_FS_TEST_ROOT="$(mktemp -d "$HOME/pd-mcp-qa-fs.XXXXXX")"
          chmod 700 "$PD_QA_FS_TEST_ROOT"
          pnpm exec jest --runInBand --testMatch '**/test/fixtures/mcp-authenticated-qa/*.spec.ts' --runTestsByPath test/fixtures/mcp-authenticated-qa/contract.spec.ts test/fixtures/mcp-authenticated-qa/issuance.spec.ts test/fixtures/mcp-authenticated-qa/protected-store.spec.ts --json --outputFile=/tmp/mcp-qa-fixture-results.json
          node -e 'const r=require("/tmp/mcp-qa-fixture-results.json"); if(!r.success || r.numPendingTests || r.numTotalTests < 76) process.exit(1)'

      - name: Payment webhook PostgreSQL concurrency
        env:
          PAYMENT_LEDGER_TEST_DATABASE_URL: postgresql://postgres:ci-only@localhost:5432/pd_security_ledger_test
        run: pnpm exec jest --runInBand --testMatch '**/payment.ledger.pgtest.ts'

      - name: Agent credential PostgreSQL lifecycle
        env:
          DATABASE_URL: postgresql://postgres:ci-only@localhost:5432/pd_security_ledger_test?schema=agent_credentials
          AGENT_CREDENTIAL_TEST_DATABASE_URL: postgresql://postgres:ci-only@localhost:5432/pd_security_ledger_test?schema=agent_credentials
        run: |
          pnpm exec prisma db push --skip-generate --schema libraries/nestjs-libraries/src/database/prisma/schema.prisma
          pnpm exec jest --runInBand --testMatch '**/agent.credentials.pgtest.ts' --json --outputFile=/tmp/mcp-credential-results.json

      - name: MCP publication PostgreSQL fence
        env:
          DATABASE_URL: postgresql://postgres:ci-only@localhost:5432/pd_security_ledger_test?schema=mcp_publication
          MCP_PUBLICATION_TEST_DATABASE_URL: postgresql://postgres:ci-only@localhost:5432/pd_security_ledger_test?schema=mcp_publication
        run: |
          pnpm exec prisma db push --skip-generate --schema libraries/nestjs-libraries/src/database/prisma/schema.prisma
          pnpm exec jest --runInBand --testMatch '**/mcp.publish.pgtest.ts' --json --outputFile=/tmp/mcp-publication-results.json

      - name: MCP actual native worker and provider fixture
        env:
          DATABASE_URL: postgresql://postgres:ci-only@localhost:5432/pd_security_ledger_test?schema=mcp_worker
          MCP_WORKER_TEST_DATABASE_URL: postgresql://postgres:ci-only@localhost:5432/pd_security_ledger_test?schema=mcp_worker
          TS_NODE_COMPILER_OPTIONS: '{"module":"CommonJS","moduleResolution":"node"}'
          MCP_WORKER_TEST_RESULT_FILE: /tmp/mcp-native-summary.json
          MCP_WORKER_TEST_NAMESPACE: mcp-fixture-ci
          MCP_WORKER_TEST_TEMPORAL_ADDRESS: localhost:7233
        run: |
          pnpm exec prisma db push --skip-generate --schema libraries/nestjs-libraries/src/database/prisma/schema.prisma
          node --experimental-require-module -r ts-node/register/transpile-only -r tsconfig-paths/register libraries/nestjs-libraries/src/database/prisma/posts/mcp.worker.fixture.ts
          node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('/tmp/mcp-native-summary.json','utf8'));if(r.frameworkExitCode!==0||r.cases.length<12||r.cases.some(t=>t.status!=='BODY_COMPLETED')||r.hooks.length)process.exit(1)"

      - name: Collect structured MCP evidence
        if: always()
        run: |
          mkdir -p ci-evidence
          node <<'NODE'
          const fs = require('fs');
          const cp = require('child_process');
          const result = { testedCommit: cp.execFileSync('git', ['rev-parse', 'HEAD'], {encoding:'utf8'}).trim(), testedTree: cp.execFileSync('git', ['rev-parse', 'HEAD^{tree}'], {encoding:'utf8'}).trim(), suites: {} };
          for (const [name, file] of [['credential','/tmp/mcp-credential-results.json'], ['publication','/tmp/mcp-publication-results.json'], ['fixture','/tmp/mcp-qa-fixture-results.json']]) {
            if (!fs.existsSync(file)) { result.suites[name] = {status:'NO_RESULT'}; continue; }
            const data = JSON.parse(fs.readFileSync(file, 'utf8'));
            result.suites[name] = { success: data.success, passed: data.numPassedTests, failed: data.numFailedTests, assertions: (data.testResults||[]).flatMap(suite => (suite.assertionResults||[]).map(test => ({name:test.fullName,status:test.status,codes:(test.failureDetails||[]).map(error=>error?.code).filter(code=>typeof code==='number'||(typeof code==='string'&&/^[A-Z0-9_-]{1,40}$/.test(code)))}))) };
          }
          result.suites.native = fs.existsSync('/tmp/mcp-native-summary.json') ? JSON.parse(fs.readFileSync('/tmp/mcp-native-summary.json','utf8')) : {status:'NO_RESULT'};
          fs.writeFileSync('ci-evidence/mcp-summary.json', JSON.stringify(result,null,2));
          NODE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcp-structured-evidence
          path: ci-evidence/mcp-summary.json
          if-no-files-found: warn

      - name: Build
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        id: application-build
        # the default Node heap runs out building the backend; the release
        # image builds with 3 GB (deploy/postdelegate/Dockerfile.release)
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          mkdir -p ci-build-evidence
          node <<'NODE'
          const fs = require('fs'), cp = require('child_process');
          const report = { head:cp.execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(), tree:cp.execFileSync('git',['rev-parse','HEAD^{tree}'],{encoding:'utf8'}).trim(), exitCode:null, diagnostics:[] };
          const save = () => fs.writeFileSync('ci-build-evidence/type-diagnostics.json',JSON.stringify(report,null,2));
          save();
          let location;
          const inspect = line => {
            const project = /apps\/(frontend|backend|orchestrator) build/.exec(line)?.[1];
            const source = /((?:apps|libraries)\/[A-Za-z0-9_./@()\[\]-]+|(?:\.\/)?src\/[A-Za-z0-9_./@()\[\]-]+)(?:\((\d+),(\d+)\)|:(\d+):(\d+))?/.exec(line);
            if(source) {
              const file = (/^(?:\.\/)?src\//.test(source[1])) ? (project ? `apps/${project}/${source[1].replace(/^\.\//,'')}` : undefined) : source[1];
              if(file) location = {file,...(source[2]||source[4] ? {line:Number(source[2]||source[4]),column:Number(source[3]||source[5])} : {})};
            }
            const code = /\bTS(\d{3,5})\b/.exec(line);
            const category = code ? 'TYPESCRIPT' : /Type error:/.test(line) ? 'TYPECHECK' : /Failed to compile|Module not found|Module build failed/.test(line) ? 'BUNDLE' : undefined;
            if(category && report.diagnostics.length < 100) { report.diagnostics.push({category,...(project ? {project}:{}),...(code ? {code:Number(code[1])}:{}),...location}); save(); }
          };
          const child = cp.spawn('pnpm',['run','build'],{env:{...process.env,FORCE_COLOR:'0',NO_COLOR:'1'},stdio:['ignore','pipe','pipe']});
          for(const [stream,output] of [[child.stdout,process.stdout],[child.stderr,process.stderr]]) {
            let pending = '';
            stream.on('data',chunk=>{ output.write(chunk); pending += chunk.toString(); let index; while((index=pending.indexOf('\n'))>=0){inspect(pending.slice(0,index));pending=pending.slice(index+1);} if(pending.length>8192) pending=''; });
            stream.on('end',()=>{if(pending)inspect(pending);});
          }
          child.on('error',()=>{report.launchFailed=true;report.exitCode=1;save();process.exitCode=1;});
          child.on('close',(code,signal)=>{report.exitCode=code===null?1:code;if(signal)report.signal=/^[A-Z0-9]{1,20}$/.test(signal)?signal:'OTHER';save();process.exitCode=report.exitCode;});
          NODE

      - uses: actions/upload-artifact@v4
        if: always() && steps.application-build.outcome != 'skipped'
        with:
          name: build-type-diagnostics
          path: ci-build-evidence/type-diagnostics.json
          if-no-files-found: error
