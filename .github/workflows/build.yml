name: Build
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: pr217-hosted-readonly-verify-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/test/pr217-verify-6708-20261115' && github.repository == 'khanjer496-alt/postdelegate' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERIFIER_WORKFLOW_SHA: ${{ github.workflow_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: wrapper
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/checkout@v4
        with:
          ref: 6708125ffc150c9d692dc8698dbe1ddae0cdedce
          path: approved
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 7c84b1ebffbccb731a972c2ff55e6bc0accea663
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          token: ''
      - name: Tiny fake network/ZIP/provenance tests only
        run: python3 -B -I wrapper/site/scripts/pr217-hosted-verify/test-verify.py
      - name: Hosted read-only exact artifact verification
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B -I wrapper/site/scripts/pr217-hosted-verify/verify.py "$RUNNER_TEMP/pr217-readonly-result/verification.json"
      - name: Store sanitized verification JSON only (never payload)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: NON_RELEASE-NOT_ACCEPTED-READONLY-VERIFICATION-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pr217-readonly-result/verification.json
          if-no-files-found: error
          retention-days: 3
