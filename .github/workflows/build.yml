name: Build
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: pr217-metadata-projection-${{ github.ref }}
  cancel-in-progress: false
jobs:
  project:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/test/pr217-metadata-c047-20261115' && github.repository == 'khanjer496-alt/postdelegate' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROJECTION_WORKFLOW_SHA: ${{ github.workflow_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: wrapper
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/checkout@v4
        with:
          ref: c047b52fbc5da99c3b10673d393611a9297dec81
          path: transport-code
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 7c84b1ebffbccb731a972c2ff55e6bc0accea663
          path: source
          persist-credentials: false
      - name: Tiny metadata and row fixtures only
        run: python3 -B -I wrapper/site/scripts/pr217-projection/test-project.py
      - name: Project authenticated metadata only (no body revalidation)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B -I wrapper/site/scripts/pr217-projection/project.py "$RUNNER_TEMP/pr217-projection"
      - name: Store exactly three nonrelease JSON files
        id: store
        uses: actions/upload-artifact@v4
        with:
          name: NON_RELEASE-NOT_ACCEPTED-METADATA-PROJECTION-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pr217-projection/identity-binding.json
            ${{ runner.temp }}/pr217-projection/public-file-index.json
            ${{ runner.temp }}/pr217-projection/row-oracles.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
      - name: Refuse oversized actual projection artifact via metadata only
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROJECTION_ARTIFACT_ID: ${{ steps.store.outputs.artifact-id }}
          PROJECTION_ARTIFACT_DIGEST: ${{ steps.store.outputs.artifact-digest }}
        run: python3 -B -I wrapper/site/scripts/pr217-projection/project.py artifact-size-check
