---
name: Build

# Check pull requests and the merged main result. Nothing is published: production
# images are built by hand from deploy/postdelegate/Dockerfile.release.
on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      # deploy/** is NOT ignored: the Caddy config that fronts production lives
      # there and nothing else compiles it. It was once committed in a state
      # Caddy refuses to load, and a Caddyfile-only pull request is exactly the
      # shape of change that would have skipped every check.
      - site/**
      - '**/*.md'
      - .github/workflows/uptime.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: pd_security_ledger_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Caddy config
        # Caddy itself is the only authority on whether this file loads: a
        # duplicate matcher, an unknown directive or a bad placeholder all
        # fail here instead of on the server. The staging login is supplied
        # from the environment on the server; any bcrypt hash validates.
        run: |
          # generated here, never written down: basic_auth only needs the
          # placeholder to parse as a bcrypt hash
          HASH="$(docker run --rm caddy:2.10-alpine caddy hash-password --plaintext ci)"
          docker run --rm \
            -v "$PWD/deploy/postdelegate/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -e STAGING_BASIC_AUTH_USER=ci \
            -e STAGING_BASIC_AUTH_HASH="$HASH" \
            caddy:2.10-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        # the jest suite never ran in CI before; a failing spec now blocks the PR
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm exec jest --ci --forceExit

      - name: Payment webhook PostgreSQL concurrency
        env:
          PAYMENT_LEDGER_TEST_DATABASE_URL: postgresql://postgres:ci-only@localhost:5432/pd_security_ledger_test
        run: pnpm exec jest --runInBand --testMatch '**/payment.ledger.pgtest.ts'

      - name: Agent credential PostgreSQL lifecycle
        env:
          DATABASE_URL: postgresql://postgres:ci-only@localhost:5432/pd_security_ledger_test?schema=agent_credentials
          AGENT_CREDENTIAL_TEST_DATABASE_URL: postgresql://postgres:ci-only@localhost:5432/pd_security_ledger_test?schema=agent_credentials
        run: |
          pnpm exec prisma db push --skip-generate --schema libraries/nestjs-libraries/src/database/prisma/schema.prisma
          pnpm exec jest --runInBand --testMatch '**/agent.credentials.pgtest.ts'

      - name: Build
        # the default Node heap runs out building the backend; the release
        # image builds with 3 GB (deploy/postdelegate/Dockerfile.release)
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm run build
